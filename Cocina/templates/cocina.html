{% extends 'plantilla.html' %}
{% block titulo %}Cocina{% endblock %}

{% block contenido_principal %}
<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4">
    <div>
        <h1 class="h3 mb-1">Cocina</h1>
        <p class="text-muted mb-0">Panel principal de la cocina</p>
    </div>
</div>

<div class="row g-4">
    <div class="col-md-6 col-lg-4">
        <div class="card h-100">
            <div class="card-body text-center py-5">
                <i class="bi bi-clock-history display-5 text-primary mb-3"></i>
                <h5 class="card-title">Datos antiguos</h5>
                <p class="text-muted">Consulta los registros anteriores a ayer</p>
                <a href="{% url 'datos_viejos' %}" class="btn btn-primary mt-2">Ver datos</a>
            </div>
        </div>
    </div>
    <div class="col-md-6 col-lg-4">
        <div class="card h-100">
            <div class="card-body text-center py-5">
                <i class="bi bi-speedometer2 display-5 text-success mb-3"></i>
                <h5 class="card-title">Estado general</h5>
                <p class="text-muted">Todo en orden por aquí</p>
                <span class="badge text-bg-success-subtle text-success-emphasis rounded-pill px-3 py-2">Activo</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
